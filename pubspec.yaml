name: job_connect
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UID
  uuid: ^4.4.0

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.6

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Authentication
  google_sign_in: ^6.2.1
