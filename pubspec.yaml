  flutter_pdfview: ^1.3.2
  open_filex: ^4.4.0

  share_plus: ^7.2.2
  package_info_plus: ^8.3.0
  pdf: ^3.11.3
  flutter_staggered_grid_view: ^0.7.0

  flutter_screenutil: ^5.9.3
  go_router: ^16.1.0
  appwrite: ^19.1.0
  mask_text_input_formatter: ^2.9.0
  pinput: ^5.0.2
  flutter_bloc: ^9.1.1
  flutter_web_auth_2: ^4.1.0
  shimmer: ^3.0.0
  rename: ^3.1.0
  device_info_plus: ^11.5.0
  responsive_framework: ^1.5.1
  flutter_native_splash: ^2.4.6
  webview_flutter: ^4.13.0
  flutter_html: ^3.0.0
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/fast-charge.png"
